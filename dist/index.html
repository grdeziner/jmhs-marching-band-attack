alse,"anchor":{"x":6,"y":32},"notes":"Expanding sound-shockwave blast. Spawn on special frame index 3 (the mallet slam), origin at the front of the bass drum, travelling right."},"notes":"3/4 view, facing right. Game flips the sprite for the left side. Feet sit on the bottom of the frame; anchor is bottom-center (48, 111). Jump / KO poses stay in the same frame space — the game moves the entity. Special frame 3 slams the drum and should spawn projectile.png. Palette is navy + gold + white trim. Official fighter name is Marcus \"Thunder\" Boone (see content/characters/drummer.json).","files":{"sheet":"sheet.png","portrait":"portrait.png","projectile":"projectile.png","preview":"preview.gif","previewSheet4x":"preview_sheet_4x.png"}},"content/characters/xylophone.json":{"id":"xylophone","name":"Penny \"Mallets\" Okafor","section":"Front Ensemble (Pit)","instrument":"Xylophone","fightingStyle":"Fast and technical. Fights with two pairs of mallet sticks in rapid rolls and flurries, ringing out a hit for every note in a scale. Her combos run up and down like arpeggios.","personality":"Bright, quick-talking and a bit of a perfectionist. Practices scales in the locker room before anyone else gets there and always knows exactly how many notes she just hit.","rivals":["drummer","flute"],"whyTheyFight":"The pit stands on the sideline while everyone else marches, and Penny is tired of the front ensemble being called 'the furniture.' Winning Band Wars means the pit gets a real feature in the halftime show.","taunt":"Do-re-mi-fa-so-long!","winQuote":"Sixteen notes, sixteen hits. I counted.","ending":"With the Golden Plume in hand, Penny writes a halftime feature where the pit is wheeled to the 50-yard line under the lights. The crowd hears every bar ring out across the field. The drumline admits, grudgingly, that 'the furniture' can play."},"content/characters/flute.json":{"id":"flute","name":"Skye \"Silver Stick\" Lin","section":"Woodwinds","instrument":"Flute","fightingStyle":"Quick and pokey. Uses the flute as a bashing staff, with fast jabs, sweeping spins and an overhead bonk. Light on her feet and hard to pin down, with high trill whistles that throw off opponents' timing.","personality":"Cheerful on the outside and fiercely competitive underneath. Polishes her flute between rounds and won't hear a bad word about the woodwinds.","rivals":["clarinet","colorguard"],"whyTheyFight":"The flutes always get drowned out by the brass. Skye wants to prove that the smallest instrument on the field can stand up to the loudest, and she wants the solo at the final home game.","taunt":"Small instrument. Big headache.","winQuote":"Heard me that time, didn't you?","ending":"Skye plays the solo at the final home game, alone in a single spotlight on the dark field, and the whole stadium goes quiet to hear it. Afterward the brass section buys her fries at the fast food place, and she accepts politely."},"content/characters/trumpet.json":{"id":"trumpet","name":"Dante \"High C\" Reyes","section":"High Brass","instrument":"Trumpet","fightingStyle":"Flashy rushdown. Fast punches and a piercing high-note blast fired as a projectile. His super is a screaming high C fanfare that pushes opponents back across the screen.","personality":"Loud, confident and a bit of a show-off. Always wants to be in the spotlight and usually is. Deep down he's loyal to his section.","rivals":["trombone","flute"],"whyTheyFight":"Dante wants the lead part in the stadium fanfare and the right to say the trumpets are the real stars of JMHS. Band Wars is the best stage he can find.","taunt":"Hear that? That's the sound of first chair.","winQuote":"Too high for you? Everything is.","ending":"Dante blasts the victory fanfare from the top row of the bleachers at the final home game, and the note echoes off the press box. Then he gives the last chord to his whole section, learning that a fanfare sounds better with more than one trumpet."},"content/characters/trombone.json":{"id":"trombone","name":"Theo \"Slide\" Washington","section":"Low Brass","instrument":"Trombone","fightingStyle":"Long-range spacer. The slide shoots out for long pokes and sweeps, so he controls distance better than anyone. His glissando special slides him across the screen in one fast rush.","personality":"Laid-back and funny, the class clown of the low brass. Hard to rattle, and smarter than he lets on.","rivals":["trumpet","tuba"],"whyTheyFight":"Theo is tired of trumpets acting like they own the brass section. He also heard the winner gets to pick the post-game playlist at the fast food place, and he has opinions.","taunt":"Mind the slide. Actually, don't. It's funnier.","winQuote":"Glissando'd. Look it up.","ending":"Theo wins, picks the post-game playlist, and turns the fast food restaurant into a dance party until closing time. The manager makes him promise never to slide-trombone near the milkshake machine again."},"content/characters/tuba.json":{"id":"tuba","name":"Gus \"Sousa-Mountain\" Romero","section":"Low Brass","instrument":"Tuba (sousaphone)","fightingStyle":"Heavy grappler. Grabs opponents and slams them, wraps them up in the sousaphone's bell loop and throws them, and lets out a low BWAAAMP blast that knocks fighters off their feet. Huge reach for throws, slow on his feet.","personality":"Gentle giant. Friendly, always hungry, and the first to help carry equipment. Becomes a different person when someone insults the low brass.","rivals":["drummer","bassclarinet"],"whyTheyFight":"Tubas carry the heaviest instruments and get the least credit. Gus fights for respect for the low brass, and because the winner of Band Wars gets free food at the fast food place for the rest of the season.","taunt":"I carry thirty pounds of brass for fun. You're lighter.","winQuote":"That's the bass line. Everything sits on it, including you.","ending":"Gus wins the Golden Plume and the season of free food, then shares it with the whole low brass section. The fast food place puts his picture on the wall. Some say the booth he sat in still has a dent shaped like a sousaphone."},"content/characters/clarinet.json":{"id":"clarinet","name":"Maya \"Squeak\" Patel","section":"Woodwinds","instrument":"Clarinet","fightingStyle":"Precise counter-fighter. Waits for openings, then punishes with sharp, accurate jabs and a piercing squeak that stuns opponents for a moment. Few wasted moves.","personality":"Serious, organized and focused, she runs sectionals like a coach. Carries a reed case everywhere. She got the nickname 'Squeak' from her freshman year, and she has turned it into a weapon.","rivals":["bassclarinet","flute"],"whyTheyFight":"Maya plans to be drum major one day, and winning Band Wars proves she can lead. She also wants everyone to finally stop calling her 'Squeak.'","taunt":"Every reed is ready. Are you?","winQuote":"Precision beats volume. Every time.","ending":"Maya takes the Golden Plume and leads the next locker room pep talk herself. The whole band listens, and she's named section leader on the spot. Everyone still calls her 'Squeak,' but now they say it with respect."},"content/characters/bassclarinet.json":{"id":"bassclarinet","name":"Ozzie \"The Deep End\" Lindqvist","section":"Woodwinds","instrument":"Bass clarinet","fightingStyle":"Slow, tricky zoner. Low rumbling notes roll along the ground like waves, and the long instrument's curved bell hooks opponents in close. Hard to approach and unpredictable.","personality":"Quiet, mysterious and dryly funny. Always seems to know more than he says. Often found reading in a corner of the locker room.","rivals":["clarinet","tuba"],"whyTheyFight":"Nobody notices the bass clarinet until it's missing. Ozzie fights to show the whole band how much the low notes hold everything up, and to settle a long argument with the clarinets about whose instrument is cooler.","taunt":"You can't hear me. That's the point.","winQuote":"Told you. Low notes carry.","ending":"Ozzie wins Band Wars and arranges a halftime piece built entirely on low woodwinds. On the dark football field the rumble rattles the bleachers, and the band finally gets why he never stops talking about 'the foundation.'"},"content/characters/colorguard.json":{"id":"colorguard","name":"Jade \"Banner\" Castillo","section":"Color Guard","instrument":"Flag (and the occasional rifle toss)","fightingStyle":"Acrobatic and agile. Spinning flag sweeps, cartwheel kicks, a high air game and huge reach with the flagpole. Her special is a spinning flag toss that returns like a boomerang.","personality":"Energetic, fearless and a natural performer. Leads warm-up stretches in the locker room and isn't afraid to call anyone out, kindly but firmly.","rivals":["flute","trumpet"],"whyTheyFight":"People say color guard isn't 'really' band. Jade wants to prove the guard are the hardest-working performers on the field, and to win the Golden Plume for the guard for the first time ever.","taunt":"Eight counts. You've got one left.","winQuote":"Caught it. Didn't even look.","ending":"Jade wins, and the color guard leads the band onto the field at the final home game, with flags snapping under the stadium lights. Nobody ever again asks whether guard is 'really' band."},"art/stages/football/far.png":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAoAAAAFoCAIAAABIUN0GAAAWRklEQVR4nO3dTagd53kH8NHl9vr2RhUXRbWNMYmaiGKCa0wKITFZlDYEt/Gi0FJMCIVAFqErL0sxJQsTstSilCwMhRCMCDFk4VBj3NCVIwoNxTHFFOEoQRhbUcStot6qQly6OPbJaL7OfD9zZn4/Qrg+OmfmPfPx/ud55+OceuDgXAIAjGsnugEAsEQCGAACCGCAut6//svoJjAfLQPYVggs0EMP/m50E5iPUy7CAoDxNaiAX37t8nDtAJgIfd2UzWn8VQXM0r1//ZfGFYHxuQiLpZO+QO/qjKMIYGChDDUznL/44mc3vic4gMffAexyQPJhV6BDIJBzwMBCvfza5TplCgxEAANAAOeAAeif4f2NBDAAPXOKvQ4BDEDPVifXY0+xTz/+nQMGgAAqYLbMnB5EV2j6h+1AL1TAABBABQwAAQQwAIP7wz96NroJk2MIeoY83weIVTNu//1fLw3dkikTwAD0o3WZu8wkFsAAdNXLCHO/MTz9scClBPD01wTANqoZvcfHtw8OTtd553Kq4eIAnkJcvX/9l34pnTmxSTM/Zel7fHy7zsfLInkhGVwQwC+/dvnzT34ySRKdBQBlCtO3ZvSmFcbwoBk8kaPh4gp4Io0jls0AKJNP3xbRm5aP4dnXwUs5BzwbQhHKfOTMwz1O7X9uvdfj1GY
