<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JMHS Marching Band Attack</title>
  <meta name="description" content="JMHS Marching Band Attack (working title Band Wars), an 8-bit 1v1 fighting game for a high school marching band.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23100c14'/%3E%3Crect y='7' width='16' height='2' fill='%239d1c32'/%3E%3Crect y='6' width='16' height='1' fill='%23ffcc33'/%3E%3C/svg%3E">
  <style>
    html {
      background: #07060a;
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: safe center;
      justify-content: safe center;
      background: #07060a;
      color: #f6f1e4;
      user-select: none;
    }
    canvas#game {
      display: block;
      width: 320px;
      height: 180px;
      image-rendering: pixelated;
      background: #100c14;
      touch-action: none;
      cursor: pointer;
    }
    canvas#game:focus {
      outline: none;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <h1 class="sr-only">JMHS Marching Band Attack</h1>
  <canvas id="game" width="320" height="180" data-scene="loading" aria-label="JMHS Marching Band Attack. Loading.">
    JMHS Marching Band Attack
  </canvas>
  <p id="status" class="sr-only" aria-live="polite">Loading.</p>
  <noscript>This game needs JavaScript. Serve the folder over HTTP and reload.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
