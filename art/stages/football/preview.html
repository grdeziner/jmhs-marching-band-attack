<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Band Wars — Friday Night Field</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0a0b10; color: #f6f2ea; font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { padding: 16px 20px 8px; }
  h1 { font-size: 16px; font-weight: 700; margin: 0 0 4px; color: #f5de6a; }
  .sub { color: #b9b3a6; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; padding: 0 20px 24px; }
  .stage { position: relative; width: 640px; height: 360px; image-rendering: pixelated; image-rendering: crisp-edges; overflow: hidden; background: #000; box-shadow: 0 0 0 1px #3a5a9c; }
  .stage.x2 { width: 1280px; height: 720px; }
  .stage.x2 .layer, .stage.x2 .guide { transform: scale(2); transform-origin: 0 0; }
  .layer { position: absolute; left: 0; top: 0; pointer-events: none; image-rendering: pixelated; }
  .layer.far { left: 0; }
  .layer.mid, .layer.anim { left: -160px; }
  .guide { position: absolute; left: 0; top: 0; width: 640px; height: 360px; pointer-events: none; }
  label { margin-right: 14px; user-select: none; }
  canvas.guide { image-rendering: pixelated; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 24px; }
  .thumbs figure { margin: 0; }
  .thumbs img { image-rendering: pixelated; background: #12151c; box-shadow: 0 0 0 1px #2c3038; }
  figcaption { color: #8b8578; font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Friday Night Field</h1>
  <div class="sub">640×360 view · mid/anim 960×360 · floor y=320 · band y=300–360</div>
  <div>
    <label><input type="checkbox" id="far" checked> far</label>
    <label><input type="checkbox" id="mid" checked> mid</label>
    <label><input type="checkbox" id="anim" checked> anim</label>
    <label><input type="checkbox" id="guides"> floor guides</label>
    <label><input type="checkbox" id="x2"> 2× view</label>
    <label><input type="checkbox" id="play" checked> play anim</label>
  </div>
</header>
<div class="row">
  <div class="stage" id="stage">
    <img class="layer far" id="farImg" src="far.png" width="640" height="360" alt="far">
    <img class="layer mid" id="midImg" src="mid.png" width="960" height="360" alt="mid">
    <img class="layer anim" id="animImg" src="anim_0.png" width="960" height="360" alt="anim">
    <canvas class="guide" id="guide" width="640" height="360"></canvas>
  </div>
</div>
<div class="thumbs">
  <figure><img src="preview.png" width="640" height="360" alt="preview"><figcaption>preview.png 640×360</figcaption></figure>
  <figure><img src="preview@2x.png" width="640" height="360" alt="preview 2x"><figcaption>preview@2x.png (shown 1× CSS, file is 1280×720)</figcaption></figure>
</div>
<script type="module">
  const frames = ["anim_0.png","anim_1.png","anim_2.png","anim_3.png"];
  let i = 0, acc = 0, last = performance.now();
  const animImg = document.getElementById("animImg");
  const stage = document.getElementById("stage");
  const guide = document.getElementById("guide");
  const g = guide.getContext("2d");
  g.imageSmoothingEnabled = false;
  function drawGuides() {
    g.clearRect(0, 0, 640, 360);
    if (!document.getElementById("guides").checked) return;
    g.fillStyle = "rgba(255,0,0,0.12)";
    g.fillRect(0, 300, 640, 60);
    g.fillStyle = "#ff3040";
    g.fillRect(0, 300, 640, 1);
    g.fillRect(0, 359, 640, 1);
    g.fillStyle = "#f5de6a";
    g.fillRect(0, 320, 640, 1);
    g.fillStyle = "#3a5a9c";
    g.fillRect(320, 0, 1, 360);
  }
  function tick(ts) {
    const dt = ts - last; last = ts;
    if (document.getElementById("play").checked) {
      acc += dt;
      if (acc >= 140) { acc = 0; i = (i + 1) % 4; animImg.src = frames[i]; }
    }
    requestAnimationFrame(tick);
  }
  for (const id of ["far","mid","anim"]) {
    document.getElementById(id).addEventListener("change", (e) => {
      document.getElementById(id === "anim" ? "animImg" : id + "Img").style.display = e.target.checked ? "block" : "none";
    });
  }
  document.getElementById("guides").addEventListener("change", drawGuides);
  document.getElementById("x2").addEventListener("change", (e) => stage.classList.toggle("x2", e.target.checked));
  drawGuides();
  requestAnimationFrame(tick);
</script>
</body>
</html>
